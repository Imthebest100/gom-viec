<body><<title>Gom Việc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
/* Bố cục: một cột gọn, thanh chuyển tab ở đáy (điện thoại) hoặc trên đầu (máy tính). Màu lấy từ hoa sen (hồng sen + xanh lá sen) và nền xanh xám nhạt. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --surface2:#E9EFE9; --ink:#1C2823; --muted:#5B6A62; --line:#D6DFD8;
  --accent:#B0345F; --on-accent:#FFFFFF; --leaf:#2B6A4E; --warn:#A85A06; --warn-bg:#FBEBD2;
  --c-content:#B0345F; --c-khach:#1B7385; --c-hoc:#3A68AE; --c-nha:#8A6420; --c-khac:#5B6A62;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --s-gom:#B0345F; --s-today:#2B6A4E; --s-week:#2F6FB0; --s-pri:#B8650B; --s-content:#7A4BB5; --s-hoc:#0E7C7B; --on-sec:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111915; --surface:#19231E; --surface2:#222F28; --ink:#E5EEE8; --muted:#9BABA2; --line:#2C3A33;
  --accent:#E67BA2; --on-accent:#2A0A17; --leaf:#6CC49B; --warn:#EBA650; --warn-bg:#3A2A12;
  --c-content:#E67BA2; --c-khach:#5CC1D3; --c-hoc:#8CB1EA; --c-nha:#D6B26C; --c-khac:#9BABA2; --s-gom:#E67BA2; --s-today:#6CC49B; --s-week:#7DB2F0; --s-pri:#EBA650; --s-content:#C79BF0; --s-hoc:#4FD1C5; --on-sec:#10201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#19231E; --surface2:#222F28; --ink:#E5EEE8; --muted:#9BABA2; --line:#2C3A33;
  --accent:#E67BA2; --on-accent:#2A0A17; --leaf:#6CC49B; --warn:#EBA650; --warn-bg:#3A2A12;
  --c-content:#E67BA2; --c-khach:#5CC1D3; --c-hoc:#8CB1EA; --c-nha:#D6B26C; --c-khac:#9BABA2; --s-gom:#E67BA2; --s-today:#6CC49B; --s-week:#7DB2F0; --s-pri:#EBA650; --s-content:#C79BF0; --s-hoc:#4FD1C5; --on-sec:#10201A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1}
h2{font-size:22px;line-height:1.2}
h3{font-size:16px;font-family:var(--font-body);font-weight:600;letter-spacing:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.tools{display:flex;align-items:center;gap:10px}
#status{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--warn)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;max-width:200px;border:0;background:transparent;padding:8px 2px;border-radius:8px;color:var(--muted);font-size:12px;font-weight:500;min-height:44px}
.verdict{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:color-mix(in srgb,var(--leaf) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--leaf) 40%,transparent)}
.verdict.tight,.verdict.over{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.verdict b.big{font-family:var(--font-display);font-size:20px}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.cmp th{color:var(--muted);font-weight:500}
.scroll-x{overflow-x:auto}
.lcard{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.lcard:first-of-type{border-top:0}
.tabs button[aria-current="true"]{color:var(--accent);background:var(--surface2);font-weight:600}
@media (min-width:860px){
  body{padding-block:16px 40px}
  .tabs{position:static;border:1px solid var(--line);border-radius:10px;margin-bottom:18px;padding:4px;justify-content:flex-start;gap:4px}
  .tabs button{flex:0 0 auto;padding:8px 20px;max-width:none;font-size:14px}
  .fab{bottom:24px!important}
}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;
  background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 20px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.22);min-height:48px}

.view{display:none}
.view.on{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.panel.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.panel h3{margin-bottom:8px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nav{display:flex;gap:6px;align-items:center}

textarea#dump{width:100%;min-height:150px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--on-accent);font-weight:700;padding:0;margin-top:1px}
.done .chk,.chk.on{background:var(--leaf);border-color:var(--leaf)}
.body{min-width:0;flex:1}
.ttl{border:0;background:none;padding:0;text-align:left;font-weight:500;overflow-wrap:anywhere}
.ttl:hover{text-decoration:underline}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.tm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.hot{background:var(--warn-bg);color:var(--warn)}
.chip.imp{background:color-mix(in srgb,var(--leaf) 16%,transparent);color:var(--leaf)}
.chip.cat{background:color-mix(in srgb,var(--cc) 15%,transparent);color:var(--cc)}
.c-content{--cc:var(--c-content)}.c-khach{--cc:var(--c-khach)}.c-hoc{--cc:var(--c-hoc)}.c-nha{--cc:var(--c-nha)}.c-khac{--cc:var(--c-khac)}
.empty{color:var(--muted);padding:6px 0}
.sec{margin-top:4px}
.sec h3{display:flex;justify-content:space-between;gap:8px}

.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.bar.over i{background:var(--warn)}

.grid7{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.grid7{grid-template-columns:repeat(2,1fr)}}
@media (min-width:980px){.grid7{grid-template-columns:repeat(4,1fr)}}
.day{display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border:0;background:none;padding:0;text-align:left;width:100%}
.day .dh b{font-family:var(--font-display);font-size:17px}
.item{display:flex;gap:6px;font-size:13px;align-items:baseline;width:100%;border:0;background:none;padding:2px 0;text-align:left}
.item .tm{font-size:12px;min-width:38px}
.item span.t{overflow-wrap:anywhere;min-width:0}
.item.done span.t{text-decoration:line-through;color:var(--muted)}

.quad{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:720px){.quad{grid-template-columns:1fr 1fr}}
.quad .panel h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.quad .panel .hint{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--font-body)}
.q-now{border-top:4px solid var(--warn)}.q-plan{border-top:4px solid var(--leaf)}.q-fast{border-top:4px solid var(--c-hoc)}.q-drop{border-top:4px solid var(--line)}

.kan{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:720px){.kan{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.card p{overflow-wrap:anywhere}
.card .acts{display:flex;gap:6px;justify-content:space-between}

.form{display:grid;gap:10px}
.form.two{grid-template-columns:1fr 1fr}
@media (max-width:520px){.form.two{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;color:var(--ink)}

#modal:empty{display:none}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,18,14,.5);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:640px){.scrim{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h2{margin-bottom:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90%;font-size:14px;text-align:center}
#toast:empty{display:none}
/* ---- Khung trang web ---- */
body{padding:0 0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.site-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-family:var(--font-display);font-size:20px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px}
.site .tools{margin-left:auto}
.wrap{padding-top:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot{max-width:1040px;margin:40px auto 0;padding:20px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
.btn,#status,.tabs button{white-space:nowrap}
@media (max-width:700px){#status{display:none}}
@media (min-width:860px){
  .site-in{flex-wrap:wrap;row-gap:0}
  .site .tabs{position:static;order:3;flex:1 0 100%;border:0;margin:0 0 8px;padding:0;background:transparent;justify-content:flex-start;gap:2px;max-width:none}
  .site .tools{order:2}
  body{padding-bottom:40px}
}
@media (min-width:1180px){
  .site-in{flex-wrap:nowrap}
  .site .tabs{order:0;flex:1 1 auto;margin:0 0 0 12px}
}

/* ---- Nhóm màu theo từng mục ---- */
#v-gom,.tabs [data-t=gom]{--sec:var(--s-gom)}
#v-hom-nay,.tabs [data-t=hom-nay]{--sec:var(--s-today)}
#v-tuan,.tabs [data-t=tuan]{--sec:var(--s-week)}
#v-uu-tien,.tabs [data-t=uu-tien]{--sec:var(--s-pri)}
#v-content,.tabs [data-t=content]{--sec:var(--s-content)}
#v-hoc,.tabs [data-t=hoc]{--sec:var(--s-hoc)}
.panel{border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(20,40,30,.05),0 12px 28px -14px rgba(20,40,30,.18)}
.panel h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--sec,var(--leaf));flex:none}
.view .btn.primary{background:var(--sec);border-color:var(--sec);color:var(--on-sec)}
.hero{display:flex;gap:16px;align-items:center;padding:20px;border-radius:16px;background:color-mix(in srgb,var(--sec) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--sec) 30%,transparent);flex-wrap:wrap}
.hero .ic{width:48px;height:48px;border-radius:14px;background:var(--sec);color:var(--on-sec);display:grid;place-items:center;flex:none}
.hero .ic svg,.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero .tx{flex:1;min-width:200px}
.hero h2{font-size:24px}
.hero p{color:var(--muted);margin-top:2px;font-size:14px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 2px}
.tabs button svg{width:22px;height:22px;stroke-width:1.9}
.tabs button[aria-current="true"]{background:color-mix(in srgb,var(--sec) 16%,transparent);color:var(--sec)}
@media (min-width:860px){.tabs button{flex-direction:row;gap:8px;font-size:14px;padding:8px 18px}.tabs button svg{width:20px;height:20px}}
.steps{display:flex;gap:6px 18px;flex-wrap:wrap;list-style:none;margin:0 0 14px;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--sec);color:var(--on-sec);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.panel.q-now{border-top-width:1px;background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.panel.q-plan{border-top-width:1px;background:color-mix(in srgb,var(--leaf) 10%,var(--surface))}
.panel.q-fast{border-top-width:1px;background:color-mix(in srgb,var(--c-hoc) 10%,var(--surface))}
.panel.q-drop{border-top-width:1px;background:color-mix(in srgb,var(--muted) 8%,var(--surface))}
.q-now h3::before{background:var(--warn)}.q-plan h3::before{background:var(--leaf)}.q-fast h3::before{background:var(--c-hoc)}.q-drop h3::before{background:var(--muted)}
.k0{--sec:var(--muted)}.k1{--sec:var(--s-pri)}.k2{--sec:var(--s-week)}.k3{--sec:var(--s-today)}
.kan .panel{background:color-mix(in srgb,var(--sec) 8%,var(--surface))}
.kan .card{background:var(--surface)}
.lcard .chk,.row .chk{border-color:color-mix(in srgb,var(--sec,var(--leaf)) 55%,var(--line))}
.done .chk,.chk.on{background:var(--sec,var(--leaf));border-color:var(--sec,var(--leaf));color:var(--on-sec)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}}
</style>

  <a class="brand" href="#gom"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c2.2 3 2.2 7 0 11-2.2-4-2.2-8 0-11z"/><path d="M12 15c-4.2 0-7.200-2.800-8-7 3.200 0 6 1.200 8 4M12 15c4.200 0 7.200-2.800 8-7-3.200 0-6 1.200-8 4M7 19.500h10"/></svg></span><span><b>Gom Việc</b><small id="todayLabel"></small></span></a>
  <nav class="tabs" aria-label="Các màn hình">

        <textarea id="dump" placeholder="Ví dụ:
mai 9h chụp ảnh liệu trình mới, gấp
thứ 6 đăng bài khuyến mãi lên Facebook
trả lời tin nhắn khách hỏi giá
chiều nay họp với chị chủ 1 tiếng
mua quà sinh nhật cho mẹ cuối tuần

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var pYmd=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var addDays=function(s,n){var d=pYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
var toMin=function(t){var a=t.split(':').map(Number);return a[0]*60+a[1]};
var fromMin=function(m){return pad(Math.floor(m/60))+':'+pad(m%60)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var WD=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
var WDs=['CN','T2','T3','T4','T5','T6','T7'];
var CAT={content:'Content',khach:'Khách',hoc:'Học',nha:'Nhà & cá nhân',khac:'Khác'};
var DUR0={content:90,khach:30,hoc:60,nha:45,khac:45};
var STAT=['Ý tưởng','Đang viết','Chờ đăng','Đã đăng'];
var PLAT=['Facebook','TikTok','Zalo','Instagram'];
var TODAY=ymd(new Date());
var nowMin=function(){var n=new Date();return n.getHours()*60+n.getMinutes()};
var dLabel=function(s){var d=pYmd(s);return WD[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)};
var durLabel=function(m){return m>=60?(Math.floor(m/60)+' giờ'+(m%60?(' '+m%60+' phút'):'')):(m+' phút')};
var mondayOf=function(s){var d=pYmd(s);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)};

/* ---------- Dữ liệu ---------- */
var LS='gomviec.v1';
var S=null;
var V={date:TODAY,week:mondayOf(TODAY),tab:'gom',fresh:{}};

function seed(){
  var t1=addDays(TODAY,1);
  var T=function(title,cat,o){return Object.assign({id:uid(),title:title,cat:cat,date:null,time:null,dur:DUR0[cat],urgent:false,important:false,done:false,ex:true},o||{})};
  return {v:1,updatedAt:0,seeded:true,
    settings:{start:8,end:20,cap:6},
    tasks:[
      T('Chụp ảnh liệu trình mới cho bài giới thiệu','content',{date:TODAY,time:'09:00',dur:90,important:true}),
      T('Trả lời tin nhắn khách hỏi giá','khach',{date:TODAY,time:'11:00',dur:30,urgent:true,important:true}),
      T('Viết caption bài chăm sóc da mùa khô','content',{date:t1,dur:60,important:true}),
      T('Quay video ngắn cho TikTok','content',{dur:90}),
      T('Đặt lịch khám răng','nha',{dur:30}),
      T('Làm bài học Agent Boss','hoc',{dur:60,important:true}),
      T('Gửi báo cáo tuần cho chị chủ','khach',{dur:45,urgent:true,important:true})
    ],
    habits:[
      {id:uid(),title:'Đăng bài Facebook',days:[1,3,5],ex:true},
      {id:uid(),title:'Trả lời hết tin nhắn cuối ngày',days:[1,2,3,4,5,6],ex:true}
    ],
    habitLog:{},
    learn:[
      {id:uid(),title:'Chụp ảnh sản phẩm bằng điện thoại',hours:12,per:2,sess:60,pri:0,try:true,ex:true},
      {id:uid(),title:'Viết kịch bản video ngắn',hours:10,per:2,sess:45,pri:1,try:true,ex:true},
      {id:uid(),title:'Tiếng Anh giao tiếp',hours:60,per:4,sess:45,pri:2,try:true,ex:true}
    ],
    posts:[
      {id:uid(),idea:'Mẹo chăm da sau khi đi nắng',plat:'Facebook',date:addDays(TODAY,2),status:0,ex:true},
      {id:uid(),idea:'Video 15 giây: trước và sau liệu trình',plat:'TikTok',date:addDays(TODAY,3),status:1,ex:true}
    ]};
}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r)return JSON.parse(r)}catch(e){}return null}
function fix(s){
  s.settings=Object.assign({start:8,end:20,cap:6},s.settings||{});
  s.learn=s.learn||[];
  s.tasks=s.tasks||[];s.habits=s.habits||[];s.habitLog=s.habitLog||{};s.posts=s.posts||[];
  return s;
}
S=fix(loadLocal()||seed());

/* ---------- Lưu trữ ---------- */
var docRef=null,saving=false,again=false,timer=null;
function setStatus(k){
  var t={saving:'Đang lưu…',ok:'Đã lưu',local:'Lưu trong trình duyệt này'}[k]||'';
  $('#status').textContent=t;
}
function persist(){S.updatedAt=Date.now();clearTimeout(timer);setStatus('saving');timer=setTimeout(flush,500)}
function flush(){
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!docRef){setStatus('local');return Promise.resolve()}
  if(saving){again=true;return Promise.resolve()}
  saving=true;
  return docRef.set(JSON.parse(JSON.stringify(S))).then(function(){setStatus('ok')},function(){setStatus('local')}).then(function(){
    saving=false;if(again){again=false;flush()}
  });
}
function adopt(remote){
  if(!remote||!remote.updatedAt||remote.updatedAt<=S.updatedAt)return false;
  S=fix(remote);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  return true;
}
function initStore(){
  if(!(window.claude&&window.claude.use)){setStatus('local');return}
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var user=r[0],db=r[1];
    if(!user||!db){setStatus('local');return null}
    return user.id().then(function(id){
      if(!id){setStatus('local');return null}
      docRef=db.doc('data/users/'+id+'/planner');
      return docRef.get().then(function(snap){
        if(snap.exists&&adopt(snap.data())){render();setStatus('ok')}
        else flush();
      });
    });
  }).catch(function(){setStatus('local')});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&docRef&&!$('#modal').firstChild&&!saving){
      docRef.get().then(function(snap){if(snap.exists&&adopt(snap.data()))render()}).catch(function(){});
    }
  });
}

/* ---------- Tách ý nghĩ lộn xộn thành việc ---------- */
var WMAP={hai:1,'2':1,ba:2,'3':2,'tư':3,'bốn':3,'4':3,'năm':4,'5':4,'sáu':5,'6':5,'bảy':6,'7':6};
function nextWd(target){var d=pYmd(TODAY);var diff=(target-d.getDay()+7)%7;return addDays(TODAY,diff)}
function parseOne(raw){
  var t=raw.trim();if(t.length<2)return null;
  var low=t.toLowerCase();
  var work=low;
  var dur=null,m;
  if((m=work.match(/(?:mất|trong|khoảng|làm)\s*(\d+(?:[.,]\d+)?)\s*(?:tiếng|giờ|h)(?![\p{L}])/u))){dur=Math.round(parseFloat(m[1].replace(',','.'))*60);work=work.replace(m[0],' ')}
  else if((m=work.match(/(\d+(?:[.,]\d+)?)\s*tiếng/u))){dur=Math.round(parseFloat(m[1].replace(',','.'))*60);work=work.replace(m[0],' ')}
  else if((m=work.match(/(\d+)\s*phút/u))){dur=parseInt(m[1],10);work=work.replace(m[0],' ')}
  var date=null,time=null,hasPart=null;
  if(/hôm nay|(?:sáng|trưa|chiều|tối)\s+nay/u.test(work))date=TODAY;
  else if(/ngày mai|(?:^|[\s,])mai(?=$|[\s,.!])/u.test(work))date=addDays(TODAY,1);
  else if(/ngày kia|(?:^|[\s,])mốt(?=$|[\s,.!])/u.test(work))date=addDays(TODAY,2);
  var wm=work.match(/thứ\s*(hai|ba|tư|bốn|năm|sáu|bảy|[2-7])(?![\p{L}\d])/u);
  if(wm&&!date){date=nextWd(WMAP[wm[1]])}
  else if(!date&&/chủ nhật|(?:^|[\s,])cn(?=$|[\s,.!])/u.test(work))date=nextWd(0);
  else if(!date&&/cuối tuần/u.test(work))date=nextWd(6);
  if(/tuần sau|tuần tới/u.test(work)){date=date?(date<=addDays(TODAY,6)?addDays(date,7):date):addDays(mondayOf(TODAY),7)}
  var dm=work.match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
  if(dm){var y=pYmd(TODAY).getFullYear();var cand=y+'-'+pad(+dm[2])+'-'+pad(+dm[1]);if(cand<TODAY)cand=(y+1)+'-'+pad(+dm[2])+'-'+pad(+dm[1]);date=cand}
  var tm=work.match(/(\d{1,2})[h:](\d{2})?(?![\p{L}])/u)||null,h=null,mi=0;
  if(tm){h=+tm[1];mi=tm[2]?+tm[2]:0}
  else if((tm=work.match(/(\d{1,2})\s*giờ(?:\s*(\d{2}))?/u))){h=+tm[1];mi=tm[2]?+tm[2]:0}
  if(h!==null&&h<=23&&mi<60){
    if(/chiều|tối/u.test(work)&&h<12)h+=12;
    time=fromMin(h*60+mi);
  }else{
    h=null;
    if(/sáng/u.test(work))time='09:00';
    else if(/trưa/u.test(work))time='13:30';
    else if(/chiều/u.test(work))time='15:00';
    else if(/tối/u.test(work))time='19:30';
  }
  if(time&&!date)date=TODAY;
  var cat='khac';
  if(/học|khóa|bài tập|agent boss|đọc sách/u.test(low))cat='hoc';
  else if(/đăng|bài viết|bài đăng|caption|video|facebook|fb\b|tiktok|reels|ảnh|content|quay|chụp|kịch bản|livestream|zalo oa/u.test(low))cat='content';
  else if(/khách|tư vấn|inbox|tin nhắn|đặt lịch|họp|sếp|chị chủ|báo cáo|báo giá|hợp đồng/u.test(low))cat='khach';
  else if(/mẹ|con |nhà|chợ|nấu|mua|khám|sinh nhật|đi chơi|giặt|dọn/u.test(low))cat='nha';
  var urgent=/gấp|khẩn|ngay\b|deadline|hạn chót|sớm nhất/u.test(low);
  var important=/quan trọng|khách|sếp|chị chủ|họp|hợp đồng|báo cáo|doanh thu|lương|đặt cọc|deadline/u.test(low);
  var title=t.replace(/(?:mất|trong|khoảng|làm)\s*\d+(?:[.,]\d+)?\s*(?:tiếng|giờ|h)(?![\p{L}])/giu,' ')
    .replace(/\d+(?:[.,]\d+)?\s*(?:tiếng|phút)/giu,' ')
    .replace(/(?:lúc\s*)?\d{1,2}[h:]\d{0,2}(?![\p{L}])/giu,' ')
    .replace(/(?:lúc\s*)?\d{1,2}\s*giờ(?:\s*\d{2})?/giu,' ')
    .replace(/hôm nay|ngày mai|ngày kia|cuối tuần|tuần sau|tuần tới|chủ nhật|thứ\s*(?:hai|ba|tư|bốn|năm|sáu|bảy|[2-7])(?![\p{L}\d])/giu,' ')
    .replace(/(?:^|\s)(?:mai|mốt)(?=$|[\s,.!])/giu,' ')
    .replace(/(?:sáng|trưa|chiều|tối)(?:\s+(?:nay|mai))?(?=$|[\s,.!])/giu,' ')
    .replace(/\d{1,2}\/\d{1,2}(?!\d)/g,' ')
    .replace(/[,.]?\s*\b(?:gấp|khẩn)\b/giu,' ')
    .replace(/\s{2,}/g,' ').replace(/^[\s,.\-:;]+|[\s,.\-:;]+$/g,'');
  if(title.length<3)title=t;
  title=title.charAt(0).toUpperCase()+title.slice(1);
  return {id:uid(),title:title,cat:cat,date:date,time:time,dur:dur||DUR0[cat],urgent:urgent,important:important,done:false};
}
function parseDump(text){
  var parts=text.split(/\n|;|•|(?<=[.!?])\s+(?=\p{L})/u).map(function(x){return x.replace(/^\s*(?:[-*•]|\d+[.)])\s+/,'')});
  var out=[];parts.forEach(function(p){var o=parseOne(p);if(o)out.push(o)});return out;
}

/* ---------- Xếp lịch tự động ---------- */
function autoSchedule(avoid){
  var st=S.settings,ds=st.start*60,de=st.end*60,capM=st.cap*60,LS_=720,LE=810;
  var open=S.tasks.filter(function(t){return !t.done});
  var loadOf=function(d){return open.filter(function(t){return t.date===d}).reduce(function(s,t){return s+t.dur},0)};
  var busy=function(d){return open.filter(function(t){return t.date===d&&t.time}).map(function(t){return [toMin(t.time),toMin(t.time)+t.dur]}).concat([[LS_,LE]]).sort(function(a,b){return a[0]-b[0]})};
  var find=function(d,dur){
    var c=ds;if(d===TODAY)c=Math.max(c,Math.ceil((nowMin()+5)/15)*15);
    c=Math.ceil(c/15)*15;
    var b=busy(d);
    for(var i=0;i<b.length;i++){if(c+dur<=b[i][0])break;c=Math.max(c,Math.ceil((b[i][1]+10)/15)*15)}
    return c+dur<=de?c:null;
  };
  var score=function(t){return (t.urgent?2:0)+(t.important?1:0)};
  var todo=open.filter(function(t){return !(t.date&&t.time)});
  todo.sort(function(a,b){
    if(!!a.date!==!!b.date)return a.date?-1:1;
    if(a.date&&b.date&&a.date!==b.date)return a.date<b.date?-1:1;
    return score(b)-score(a);
  });
  var placed=0,left=0;
  todo.forEach(function(t){
    var base=(t.date&&t.date>=TODAY)?t.date:TODAY,span=t.date?7:14,ok=false;
    for(var i=0;i<span&&!ok;i++){
      var d=addDays(base,i);
      if(d===avoid)continue;
      var first=t.date&&t.date>=TODAY&&i===0;
      if(!first){
        if(pYmd(d).getDay()===0&&!t.urgent)continue;
        if(loadOf(d)+t.dur>capM)continue;
      }
      var slot=find(d,t.dur);
      if(slot!==null){t.date=d;t.time=fromMin(slot);ok=true;placed++}
    }
    if(!ok)left++;
  });
  return {placed:placed,left:left};
}
function rebalance(date){
  var capM=S.settings.cap*60;
  var items=S.tasks.filter(function(t){return t.date===date&&!t.done});
  var load=items.reduce(function(s,t){return s+t.dur},0);
  var cand=items.filter(function(t){return !t.urgent}).sort(function(a,b){return ((a.important?1:0)-(b.important?1:0))||(b.time||'').localeCompare(a.time||'')});
  var moved=0;
  for(var i=0;i<cand.length&&load>capM;i++){load-=cand[i].dur;cand[i].date=null;cand[i].time=null;moved++}
  var r=autoSchedule(date);
  return {moved:moved,left:r.left};
}

/* ---------- Hiển thị ---------- */
function chips(t){
  return '<span class="chip cat c-'+t.cat+'">'+CAT[t.cat]+'</span>'+(t.urgent?'<span class="chip hot">Gấp</span>':'')+(t.important?'<span class="chip imp">Quan trọng</span>':'');
}
function trow(t,o){
  o=o||{};
  var when=t.time?'<span class="tm">'+t.time+'–'+fromMin(toMin(t.time)+t.dur)+'</span>':'<span>'+durLabel(t.dur)+'</span>';
  var dt=(o.showDate&&t.date)?'<span>'+dLabel(t.date)+'</span>':'';
  var extra=o.extra||'';
  return '<div class="row'+(t.done?' done':'')+'"><button class="chk" data-a="toggle" data-id="'+t.id+'" aria-label="Đánh dấu xong">'+(t.done?'✓':'')+'</button>'+
    '<div class="body"><button class="ttl" data-a="edit" data-id="'+t.id+'">'+esc(t.title)+'</button>'+
    '<div class="meta">'+when+dt+chips(t)+extra+'</div></div></div>';
}
function openTasks(){return S.tasks.filter(function(t){return !t.done})}

function renderBanner(){
  var ex=S.learn.some(function(t){return t.ex})||S.tasks.some(function(t){return t.ex})||S.habits.some(function(h){return h.ex})||S.posts.some(function(p){return p.ex});
  $('#banner').innerHTML=ex?'<div class="panel warn" style="margin-bottom:16px"><div class="head"><p class="small"><b>Đây là dữ liệu ví dụ</b> để chị xem ứng dụng chạy thế nào. Xong thì xóa đi để bắt đầu với việc thật của chị.</p><button class="btn sm" data-a="clearex">Xóa dữ liệu ví dụ</button></div></div>':'';
}

function renderInbox(){
  var inbox=openTasks().filter(function(t){return !(t.date&&t.time)});
  inbox.sort(function(a,b){return ((b.urgent?2:0)+(b.important?1:0))-((a.urgent?2:0)+(a.important?1:0))});
  var h='<div class="head"><h3 style="margin:0">Chưa có giờ</h3><span class="muted small">'+inbox.length+' việc</span></div>';
  if(!inbox.length)h+='<p class="empty">Không còn việc nào chờ xếp. Gõ thêm ý nghĩ ở khung trên khi có việc mới.</p>';
  else{
    h+='<p class="muted small" style="margin:4px 0 6px">Bấm "Xếp lịch giúp tôi", việc gấp và quan trọng được xếp vào giờ trống sớm nhất, tránh giờ ăn trưa.</p>';
    inbox.forEach(function(t){
      var nw=V.fresh[t.id]?'<span class="chip" style="background:var(--accent);color:var(--on-accent)">Mới</span>':'';
      h+=trow(t,{showDate:true,extra:nw});
    });
  }
  $('#inbox').innerHTML=h;
}

function renderToday(){
  var d=V.date,isToday=d===TODAY,st=S.settings;
  var items=S.tasks.filter(function(t){return t.date===d});
  var timed=items.filter(function(t){return t.time}).sort(function(a,b){return a.time.localeCompare(b.time)});
  var untimed=items.filter(function(t){return !t.time});
  var open=items.filter(function(t){return !t.done});
  var load=open.reduce(function(s,t){return s+t.dur},0),capM=st.cap*60;
  var windowM=(st.end-st.start)*60-90;
  var free=Math.max(0,windowM-load);
  var h='<div class="panel"><div class="head"><div><h2>'+dLabel(d)+'</h2>'+(isToday?'<p class="muted small">Hôm nay</p>':'')+'</div>'+
    '<div class="nav"><button class="btn sm" data-a="dayprev" aria-label="Ngày trước">‹</button><button class="btn sm" data-a="daytoday">Hôm nay</button><button class="btn sm" data-a="daynext" aria-label="Ngày sau">›</button></div></div>';
  var pct=Math.min(100,Math.round(load/capM*100));
  h+='<div style="margin-top:12px"><div class="bar'+(load>capM?' over':'')+'"><i style="width:'+pct+'%"></i></div>'+
    '<p class="small muted" style="margin-top:6px">'+open.length+' việc, khoảng '+durLabel(load)+'. Còn trống khoảng '+durLabel(free)+' trong giờ làm.</p></div></div>';
  if(load>capM)h+='<div class="panel warn"><div class="head"><p class="small"><b>Ngày này hơi đầy</b> (hơn '+st.cap+' giờ việc). Chị có thể dời bớt việc không gấp sang ngày khác.</p><button class="btn sm" data-a="rebalance" data-date="'+d+'">Dời bớt giúp tôi</button></div></div>';
  if(isToday){
    var late=openTasks().filter(function(t){return t.date&&t.date<TODAY});
    if(late.length){
      h+='<div class="panel warn"><h3>Việc quá hạn</h3>';
      late.forEach(function(t){h+=trow(t,{showDate:true,extra:'<button class="btn sm" data-a="movetoday" data-id="'+t.id+'">Dời sang hôm nay</button>'})});
      h+='</div>';
    }
    var hot=openTasks().filter(function(t){return !t.date&&t.urgent});
    if(hot.length){
      h+='<div class="panel warn"><div class="head"><h3>Việc gấp chưa có giờ</h3><button class="btn sm" data-a="sched">Xếp lịch giúp tôi</button></div>';
      hot.forEach(function(t){h+=trow(t)});h+='</div>';
    }
  }
  h+='<div class="panel"><h3>Lịch trong ngày</h3>';

/* ---------- Muốn học: thử xếp có khả thi không ---------- */
var PRI=['Cao','Vừa','Thấp'];
var hh=function(m){return (Math.round(m/6)/10).toString().replace('.',',')+' giờ'};
function freeWeek(){
  var st=S.settings,ds=st.start*60,de=st.end*60,capM=st.cap*60,win=(de-ds)-90,free=0;
  for(var i=0;i<7;i++){
    var d=addDays(TODAY,i);
    if(pYmd(d).getDay()===0)continue;
    var load=S.tasks.filter(function(t){return !t.done&&!t.learnId&&t.date===d}).reduce(function(s,t){return s+t.dur},0);
    var room=Math.max(0,Math.min(win,capM)-load);
    if(i===0)room=Math.round(room*Math.max(0,(de-Math.max(ds,nowMin()))/(de-ds)));
    free+=room;
  }
  var pend=S.tasks.filter(function(t){return !t.done&&!t.learnId&&!t.date}).reduce(function(s,t){return s+t.dur},0);
  return {raw:free,pend:pend,net:Math.max(0,Math.round((free-pend)*0.8))};
}
function renderLearn(){
  var F=freeWeek(),Fm=F.net;
  var items=S.learn.slice().sort(function(a,b){return a.pri-b.pri});
  var tried=items.filter(function(x){return x.try});
  var wk=function(x){return x.per*x.sess};
  var D=tried.reduce(function(s,x){return s+wk(x)},0);
  var ratio=Fm?D/Fm:(D?9:0);
  var cls='ok',head,sub='';
  if(!tried.length){cls='ok';head='Chưa chọn môn nào để thử';sub='Tick "Thử học" ở các môn bên dưới để xem có đủ thời gian không.'}
  else if(ratio<=0.7){cls='ok';head='Khả thi';sub='Chị còn dư khoảng '+hh(Fm-D)+' mỗi tuần sau khi học đủ các môn đang thử.'}
  else if(ratio<=1){cls='tight';head='Làm được nhưng sát';sub='Chỉ cần một tuần nhiều việc là bị trễ. Chị nên bớt một buổi hoặc để một môn học sau.'}
  else{
    cls='over';head='Chưa khả thi';
    var low=tried.slice().sort(function(a,b){return b.pri-a.pri||wk(b)-wk(a)})[0];
    sub='Thiếu khoảng '+hh(D-Fm)+' mỗi tuần. Gợi ý: hoãn môn "'+low.title+'" (giải phóng '+hh(wk(low))+' mỗi tuần) hoặc giảm số buổi một vài môn.';
  }
  if(tried.length>3)sub+=' Học hơn 3 môn cùng lúc rất dễ bỏ dở, chị nên chọn tối đa 2 đến 3 môn một lúc.';
  var h='<div class="verdict '+cls+'"><div class="head"><b class="big">'+head+'</b><span class="small muted">Giờ trống mỗi tuần: <b>'+hh(Fm)+'</b></span></div>'+
    '<div class="bar'+(ratio>1?' over':'')+'"><i style="width:'+Math.min(100,Math.round(ratio*100))+'%"></i></div>'+
    '<p class="small">Cần '+hh(D)+' mỗi tuần cho '+tried.length+' môn.</p><p class="small">'+esc(sub)+'</p>'+
    '<p class="small muted">Giờ trống tính từ lịch 7 ngày tới, đã trừ việc chưa có giờ, bỏ Chủ nhật và chừa 20% cho việc phát sinh.</p></div>';
  h+='<div class="panel"><h3>Danh sách muốn học</h3>';
  if(!items.length)h+='<p class="empty">Chưa có môn nào. Bấm "+ Thêm môn" để ghi.</p>';
  items.forEach(function(x){
    var alone=wk(x)<=Fm;
    var has=S.tasks.some(function(t){return !t.done&&t.learnId===x.id});
    h+='<div class="lcard"><button class="chk'+(x.try?' on':'')+'" data-a="learntry" data-id="'+x.id+'" aria-label="Thử học môn này">'+(x.try?'✓':'')+'</button>'+
      '<div class="body"><button class="ttl" data-a="learnedit" data-id="'+x.id+'">'+esc(x.title)+'</button>'+
      '<div class="meta"><span>'+x.hours+' giờ để xong</span><span>'+x.per+' buổi × '+x.sess+' phút mỗi tuần</span><span class="chip">Ưu tiên '+PRI[x.pri].toLowerCase()+'</span>'+
      '<span class="chip '+(alone?'imp':'hot')+'">'+(alone?'Một mình môn này vừa sức':'Một mình môn này cũng quá sức')+'</span></div>'+
      '<div class="actions" style="margin-top:8px"><button class="btn sm" data-a="learnplan" data-id="'+x.id+'">'+(has?'Đã xếp buổi học':'Xếp buổi học vào lịch')+'</button></div></div></div>';
  });
  h+='<p class="muted small" style="margin-top:6px">Tick là "thử học": chỉ để tính toán, chưa đưa vào lịch. Khi ưng ý, bấm "Xếp buổi học vào lịch" để xếp thử 2 tuần đầu.</p></div>';
  if(tried.length&&Fm>0){
    var f=D>Fm?Fm/D:1;
    var fin=function(weeks){var w=Math.ceil(weeks);return 'xong khoảng '+dLabel(addDays(TODAY,w*7)).split(', ')[1]+' ('+w+' tuần)'};
    var cursor=0,rows='';
    tried.forEach(function(x){
      var par=x.hours*60/(wk(x)*f);
      var seqW=x.hours*60/Math.min(wk(x),Fm);
      var end=cursor+seqW;cursor=end;
      rows+='<tr><td>'+esc(x.title)+'</td><td>'+fin(par)+'</td><td>'+fin(end)+'</td></tr>';
    });
    h+='<div class="panel"><h3>Học cùng lúc hay học lần lượt?</h3><p class="muted small" style="margin-bottom:8px">'+(f<1?'Học cùng lúc thì mỗi môn chậm lại khoảng '+Math.round((1-f)*100)+'% vì thiếu giờ.':'Học cùng lúc vẫn đủ giờ.')+' Học lần lượt thì môn ưu tiên cao xong sớm hơn.</p><div class="scroll-x"><table class="cmp"><tr><th>Môn</th><th>Học cùng lúc</th><th>Học lần lượt (theo ưu tiên)</th></tr>'+rows+'</table></div></div>';
  }
  $('#v-hoc').innerHTML=hero('hoc','<button class="btn primary" data-a="learnnew">+ Thêm môn</button>')+h;
}

    '<div class="form two"><label class="f">Loại<select id="fCat">'+Object.keys(CAT).map(function(k){return '<option value="'+k+'"'+(k===t.cat?' selected':'')+'>'+CAT[k]+'</option>'}).join('')+'</select></label>'+
    '<label class="f">Mất bao lâu<select id="fDur">'+durs.map(function(m){return '<option value="'+m+'"'+(m===t.dur?' selected':'')+'>'+durLabel(m)+'</option>'}).join('')+'</select></label>'+
    '<label class="f">Ngày<input type="date" id="fDate" value="'+(t.date||'')+'"></label>'+
    '<label class="f">Giờ bắt đầu<input type="time" id="fTime" value="'+(t.time||'')+'"></label></div>'+
    '<div class="checks"><label><input type="checkbox" id="fUrg"'+(t.urgent?' checked':'')+'>Gấp</label><label><input type="checkbox" id="fImp"'+(t.important?' checked':'')+'>Quan trọng</label></div>'+
    '<div class="actions"><button class="btn primary" data-a="savetask" data-id="'+(id||'')+'">Lưu</button><button class="btn" data-a="close">Hủy</button>'+
    (id?'<button class="btn danger" data-a="deltask" data-id="'+id+'" style="margin-left:auto">Xóa việc</button>':'')+'</div></div>');
  setTimeout(function(){var e=$('#fTitle');if(e)e.focus()},30);
}
function habitForm(id){
  var h=id?S.habits.filter(function(x){return x.id===id})[0]:{title:'',days:[1,2,3,4,5]};
  if(!h)return;
  var order=[1,2,3,4,5,6,0];
  sheet('<h2>'+(id?'Sửa thói quen':'Thêm thói quen')+'</h2><div class="form"><label class="f">Việc lặp lại<input type="text" id="hTitle" value="'+esc(h.title)+'" placeholder="Ví dụ: Đăng bài Facebook"></label>'+
    '<div><p class="small muted" style="margin-bottom:6px">Lặp vào những ngày</p><div class="days">'+order.map(function(n){return '<label><input type="checkbox" class="hd" value="'+n+'"'+(h.days.indexOf(n)>-1?' checked':'')+'>'+WDs[n]+'</label>'}).join('')+'</div></div>'+
    '<div class="actions"><button class="btn primary" data-a="savehabit" data-id="'+(id||'')+'">Lưu</button><button class="btn" data-a="close">Hủy</button>'+(id?'<button class="btn danger" data-a="delhabit" data-id="'+id+'" style="margin-left:auto">Xóa</button>':'')+'</div></div>');
  setTimeout(function(){var e=$('#hTitle');if(e)e.focus()},30);
}
function settingsForm(){
  var s=S.settings;
  sheet('<h2>Cài đặt</h2><div class="form two"><label class="f">Bắt đầu làm việc lúc (giờ)<input type="number" id="sStart" min="0" max="23" value="'+s.start+'"></label>'+
    '<label class="f">Kết thúc lúc (giờ)<input type="number" id="sEnd" min="1" max="24" value="'+s.end+'"></label>'+
    '<label class="f">Tối đa mỗi ngày (giờ việc)<input type="number" id="sCap" min="1" max="14" value="'+s.cap+'"></label></div>'+
    '<p class="small muted" style="margin:10px 0">Giờ nghỉ trưa 12:00 đến 13:30 luôn được chừa trống. Chủ nhật chỉ xếp việc gấp.</p>'+
    '<p class="small muted">Dữ liệu của chị được lưu riêng cho tài khoản của chị, người khác mở link này không thấy được.</p>'+
    '<div class="actions"><button class="btn primary" data-a="savesettings">Lưu</button><button class="btn" data-a="close">Hủy</button></div>');
}

/* ---------- Xử lý bấm ---------- */
function find(id){return S.tasks.filter(function(x){return x.id===id})[0]}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,id=b.dataset.id,t;
  if(a==='scrim'){if(e.target===b)closeModal();return}
  if(a==='tab'){go(b.dataset.t)}
  else if(a==='close'){closeModal()}
  else if(a==='parse'){
    var txt=$('#dump').value;
    if(!txt.trim()){toast('Chị gõ vài việc vào khung trên trước nhé.');return}
    var list=parseDump(txt);V.fresh={};
    list.forEach(function(x){V.fresh[x.id]=1;S.tasks.push(x)});
    $('#dump').value='';persist();render();
    toast('Đã tách thành '+list.length+' việc. Chị bấm vào tên việc để chỉnh nếu cần.');
  }
  else if(a==='sample'){$('#dump').value=$('#dump').placeholder.replace(/^Ví dụ:\s*/,'');$('#dump').focus()}
  else if(a==='sched'){
    var r=autoSchedule();persist();render();
    toast(r.placed?('Đã xếp '+r.placed+' việc vào lịch.'+(r.left?' Còn '+r.left+' việc chưa xếp được vì lịch đã đầy.':'')):(r.left?'Lịch đang đầy, chưa xếp thêm được. Thử tăng giờ làm trong Cài đặt.':'Không còn việc nào cần xếp.'));
    if(V.tab==='gom')go('hom-nay');
  }
  else if(a==='toggle'){t=find(id);if(t){t.done=!t.done;persist();render()}}
  else if(a==='edit'){taskForm(id)}
  else if(a==='newtask'){taskForm(null,V.tab==='hom-nay'?{date:V.date}:null)}
  else if(a==='savetask'){
    var title=$('#fTitle').value.trim();if(!title){toast('Chị nhập tên việc nhé.');return}
    var vals={title:title,cat:$('#fCat').value,dur:parseInt($('#fDur').value,10),date:$('#fDate').value||null,time:$('#fTime').value||null,urgent:$('#fUrg').checked,important:$('#fImp').checked};
    if(vals.time&&!vals.date)vals.date=TODAY;
    if(id){t=find(id);if(t){Object.assign(t,vals);delete t.ex}}
    else S.tasks.push(Object.assign({id:uid(),done:false},vals));
    closeModal();persist();render();
  }
  else if(a==='deltask'){S.tasks=S.tasks.filter(function(x){return x.id!==id});closeModal();persist();render();toast('Đã xóa việc.')}
  else if(a==='dayprev'){V.date=addDays(V.date,-1);render()}
  else if(a==='daynext'){V.date=addDays(V.date,1);render()}
  else if(a==='daytoday'){V.date=TODAY;render()}
  else if(a==='weekprev'){V.week=addDays(V.week,-7);render()}
  else if(a==='weeknext'){V.week=addDays(V.week,7);render()}
  else if(a==='weektoday'){V.week=mondayOf(TODAY);render()}
  else if(a==='gotoday'){V.date=b.dataset.date;go('hom-nay')}
  else if(a==='movetoday'){t=find(id);if(t){t.date=TODAY;t.time=null;persist();render()}}
  else if(a==='rebalance'){var r2=rebalance(b.dataset.date);persist();render();toast(r2.moved?('Đã dời '+r2.moved+' việc không gấp sang ngày khác.'):'Không có việc nào dời được vì còn lại toàn việc gấp.')}
  else if(a==='habitnew'){habitForm(null)}
  else if(a==='habitedit'){habitForm(id)}
  else if(a==='savehabit'){
    var ht=$('#hTitle').value.trim();if(!ht){toast('Chị nhập tên thói quen nhé.');return}
    var days=Array.prototype.map.call(document.querySelectorAll('.hd:checked'),function(x){return +x.value});
    if(!days.length){toast('Chọn ít nhất một ngày trong tuần.');return}
    if(id){var h=S.habits.filter(function(x){return x.id===id})[0];if(h){h.title=ht;h.days=days;delete h.ex}}
    else S.habits.push({id:uid(),title:ht,days:days});
    closeModal();persist();render();
  }
  else if(a==='delhabit'){S.habits=S.habits.filter(function(x){return x.id!==id});closeModal();persist();render()}
  else if(a==='habitlog'){var k=id+'_'+b.dataset.date;if(S.habitLog[k])delete S.habitLog[k];else S.habitLog[k]=1;persist();render()}
  else if(a==='postadd'){
    var idea=$('#pIdea').value.trim();if(!idea){toast('Chị nhập ý tưởng bài viết nhé.');return}
    S.posts.push({id:uid(),idea:idea,plat:$('#pPlat').value,date:$('#pDate').value||null,status:0});
    $('#pIdea').value='';persist();render();
  }
  else if(a==='postmove'){var p=S.posts.filter(function(x){return x.id===id})[0];if(p){p.status=Math.max(0,Math.min(3,p.status+parseInt(b.dataset.dir,10)));persist();render()}}
  else if(a==='postdel'){S.posts=S.posts.filter(function(x){return x.id!==id});persist();render()}
  else if(a==='learnnew'){learnForm(null)}
  else if(a==='learnedit'){learnForm(id)}
  else if(a==='learntry'){var lx=S.learn.filter(function(y){return y.id===id})[0];if(lx){lx.try=!lx.try;persist();render()}}
  else if(a==='savelearn'){
    var lt=$('#lTitle').value.trim();if(!lt){toast('Chị nhập tên môn muốn học nhé.');return}
    var lv={title:lt,hours:Math.max(1,parseFloat($('#lHours').value)||1),per:Math.max(1,Math.min(7,parseInt($('#lPer').value,10)||1)),sess:parseInt($('#lSess').value,10),pri:parseInt($('#lPri').value,10)};
    if(id){var l0=S.learn.filter(function(y){return y.id===id})[0];if(l0){Object.assign(l0,lv);delete l0.ex}}
    else S.learn.push(Object.assign({id:uid(),try:true},lv));
    closeModal();persist();render();
  }
  else if(a==='dellearn'){S.learn=S.learn.filter(function(y){return y.id!==id});S.tasks=S.tasks.filter(function(t){return t.learnId!==id||t.done});closeModal();persist();render()}
  else if(a==='learnplan'){
    var lp=S.learn.filter(function(y){return y.id===id})[0];if(!lp)return;
    if(S.tasks.some(function(t){return !t.done&&t.learnId===id})){toast('Các buổi học môn này đã nằm trong lịch rồi.');return}
    for(var li=0;li<lp.per*2;li++)S.tasks.push({id:uid(),title:'Học: '+lp.title,cat:'hoc',date:null,time:null,dur:lp.sess,urgent:false,important:false,done:false,learnId:id});
    var lr=autoSchedule();persist();render();
    toast('Đã xếp '+lr.placed+' buổi học vào lịch 2 tuần tới.'+(lr.left?' Còn '+lr.left+' buổi chưa có chỗ trống.':''));
  }
  else if(a==='settings'){settingsForm()}
  else if(a==='savesettings'){
    var s1=parseInt($('#sStart').value,10),s2=parseInt($('#sEnd').value,10),s3=parseInt($('#sCap').value,10);
    if(!(s1>=0&&s2>s1&&s3>=1)){toast('Giờ kết thúc phải sau giờ bắt đầu.');return}
    S.settings={start:s1,end:s2,cap:s3};closeModal();persist();render();
  }
  else if(a==='clearex'){
    S.learn=S.learn.filter(function(x){return !x.ex});
    S.tasks=S.tasks.filter(function(x){return !x.ex});S.habits=S.habits.filter(function(x){return !x.ex});S.posts=S.posts.filter(function(x){return !x.ex});
    persist();render();toast('Đã xóa dữ liệu ví dụ. Giờ chị bắt đầu với việc thật nhé.');
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&document.activeElement&&document.activeElement.id==='dump'){var b=$('[data-a="parse"]');if(b)b.click()}
  if(e.key==='Enter'&&document.activeElement&&(document.activeElement.id==='fTitle')){var s=$('[data-a="savetask"]');if(s)s.click()}
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='pIdea'){var p=$('[data-a="postadd"]');if(p)p.click()}
});
var TABS=['gom','hom-nay','tuan','uu-tien','content','hoc'];
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS.indexOf(h)>-1&&h!==V.tab){V.tab=h;render()}});

var h0=location.hash.slice(1);
V.tab=TABS.indexOf(h0)>-1?h0:(S.tasks.length?'hom-nay':'gom');
render();
if(!S.updatedAt)S.updatedAt=1;
initStore();
})();
</script>
